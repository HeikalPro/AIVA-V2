[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-service"
version = "0.1.2"
description = "Production-grade async-first LLM service layer with unified API across providers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LLM Service Contributors" }]
keywords = ["llm", "openai", "anthropic", "async", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "tenacity>=8.4",
  "structlog>=24.1",
  "anyio>=4.3",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.26"]
gemini = ["google-generativeai>=0.6"]
azure = ["openai>=1.30"]
huggingface = ["huggingface-hub>=0.23"]
redis = ["redis>=5.0"]
cache = ["cachetools>=5.3", "diskcache>=5.6"]
observability = [
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "opentelemetry-exporter-otlp>=1.24",
  "prometheus-client>=0.20",
]
templates = ["jinja2>=3.1"]
cli = []
semantic-cache = ["sentence-transformers>=3.0", "numpy>=1.26"]
all = [
  "llm-service[openai,anthropic,gemini,azure,huggingface,redis,cache,observability,templates,cli,semantic-cache]",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "hypothesis>=6.100",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
llm-service = "llm_service.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["llm_service"]

[tool.hatch.build.targets.sdist]
include = ["llm_service", "README.md", "CHANGELOG.md", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["llm_service", "tests"]
lint.select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "prometheus_client",
  "prometheus_client.*",
  "opentelemetry",
  "opentelemetry.*",
  "redis",
  "redis.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
